name: Publish video viewer

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Give the artifact listing API time to expose the uploaded small viewer.
      - name: Wait for artifact visibility
        run: sleep 20
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4
