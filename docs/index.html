<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>아홉 개의 방 · 21개 원본 고화질 시안</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8f4f2;color:#29292f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.8}
main{max-width:1080px;margin:auto;padding:32px 20px}h1{font-size:clamp(24px,5vw,35px);line-height:1.4;letter-spacing:-.04em}p{word-break:keep-all;overflow-wrap:anywhere}video{width:100%;display:block;aspect-ratio:16/9;background:#181417;border-radius:12px}
select{width:100%;font:inherit;padding:12px;border:1px solid #decdd3;border-radius:9px;background:#fffdfa;margin:16px 0}a{color:#924f68;overflow-wrap:anywhere;text-underline-offset:4px}.links{display:flex;gap:20px;flex-wrap:wrap}.links a{min-height:44px;display:inline-flex;align-items:center}.note{font-size:14px;color:#6d6670}button{font:inherit;min-height:48px;border:0;border-radius:9px;background:#924f68;color:white;padding:8px 22px;margin:15px 0;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b58298;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><main>
<p class="note">유난샘 · 〈아홉 개의 방〉</p><h1>21개 시안 · 원본 고화질 통합 영상</h1>
<p>갤러리의 21개 시안을 원본 프레임 그대로 연결한 영상입니다. 원하는 시안으로 이동하거나 전체 화면으로 감상할 수 있습니다.</p>
<video id="movie" controls muted playsinline webkit-playsinline preload="none" aria-label="21개 원본 고화질 통합 영상"></video>
<button id="start" type="button">▶ 통합 영상 재생</button>
<label for="chapters">원하는 시안으로 이동</label><select id="chapters"><option value="0.0">01 · 동작 1 · 칸막이 후퇴</option><option value="7.034">02 · 동작 2 · 칸막이 복원</option><option value="13.034">03 · 동작 3 · 1번 방 확장과 이웃 방의 밀려남</option><option value="18.034">04 · 동작 4 · 방 축소와 처음 배치로의 복귀</option><option value="23.034">05 · S4 · 중앙 5번 방의 확장</option><option value="30.034">06 · S5 · 아홉 방 전체 통합</option><option value="39.034">07 · S6 · 방의 깊이 변화</option><option value="46.034">08 · B1 · 공의 동기화와 해체</option><option value="54.034">09 · B2 · 연결된 방에서의 연쇄 충돌</option><option value="62.034">10 · B3 · 방 안의 공이 앞으로 접근</option><option value="69.034">11 · B4 · 잠깐의 정지와 운동 재개</option><option value="77.034">12 · P06 · 방 앞의 큰 궤도</option><option value="87.034">13 · P09 · 두 공의 앞뒤 교차</option><option value="97.034">14 · P14 · 통합된 방에서 세 공 방출</option><option value="107.034">15 · P17 · 아홉 공이 화면 전체에서 튕기기</option><option value="117.034">16 · I03 · 오목한 방에서 볼록한 상자로</option><option value="129.034">17 · I04 · 깊이가 다른 방 전체에서 튀는 같은 공</option><option value="141.034">18 · I06 · 움직이는 벽이 속이는 공의 속도</option><option value="153.034">19 · I07 · 칸막이에서 창살과 깊은 줄눈으로</option><option value="167.034">20 · I08 · 공의 윤곽을 가리는 보이지 않는 구체</option><option value="183.034">21 · I09 · 아주 밝은 방과 아주 어두운 방의 같은 공</option></select>
<p class="note" id="status" role="status" aria-live="polite"></p>
<div class="links"><a href="https://raw.githubusercontent.com/kookiny/nine-rooms-video/main/nine-rooms-21-original-1080p.mp4" target="_blank" rel="noopener">원본 MP4 열기 ↗</a><a href="https://nine-rooms-nsyme.pages.dev/#main-sequence">통합 영상과 개별 시안 갤러리 ↗</a><a href="https://nine-rooms-nsyme.pages.dev/#studies">사진·설명이 있는 전체 갤러리 ↗</a></div>
<p class="note">총 21개 · 약 3분 15초 · 원본 고화질 유지</p>
</main><script>
const video=document.querySelector('#movie'),select=document.querySelector('#chapters'),button=document.querySelector('#start'),status=document.querySelector('#status');let target=0;
button.addEventListener('click',()=>{if(!video.getAttribute('src')){video.addEventListener('loadedmetadata',()=>{video.currentTime=target},{once:true});video.src='https://raw.githubusercontent.com/kookiny/nine-rooms-video/main/nine-rooms-21-original-1080p.mp4';video.load()}video.play().catch(()=>{status.textContent='영상의 ▶ 버튼을 눌러 재생하세요.'});button.hidden=true});
select.addEventListener('change',()=>{target=Number(select.value);if(video.getAttribute('src'))video.currentTime=target});
video.addEventListener('timeupdate',()=>{let i=0;for(let j=0;j<select.options.length;j++)if(video.currentTime>=Number(select.options[j].value))i=j;select.selectedIndex=i});
video.addEventListener('playing',()=>{status.textContent=''});video.addEventListener('error',()=>{status.textContent='원본 MP4 링크로 직접 열거나 전체 갤러리에서 개별 시안을 재생하세요.'});
</script></body></html>
